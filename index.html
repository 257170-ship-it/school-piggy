<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小豬撲滿加分排行榜</title>
<style>
  :root {
    --bg1: #071b46;
    --bg2: #123b78;
    --gold: #ffd45e;
    --gold-deep: #e99b19;
    --pink: #ff9eb9;
    --ink: #10264d;
    --card: rgba(255,255,255,.94);
  }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; }
  body {
    overflow:hidden;
    color:#fff;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    background:
      radial-gradient(ellipse at 50% -15%, rgba(91,174,255,.48), transparent 55%),
      radial-gradient(circle at 12% 80%, rgba(48,127,222,.24), transparent 30%),
      linear-gradient(145deg,var(--bg2),var(--bg1) 72%);
  }
  .stage { width:100%; height:100%; padding:1.5vh 2vw 1.2vh; display:flex; flex-direction:column; gap:1vh; position:relative; isolation:isolate; }
  .particle-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:-1; }
  .coin-particle {
    position:absolute; bottom:-35px; width:13px; height:13px; border-radius:50%;
    background:linear-gradient(135deg,#fff4a8,#ffbd24 60%,#d98408);
    border:2px solid rgba(255,239,155,.85); box-shadow:0 0 14px #ffc847;
    animation:floatUp linear infinite; opacity:.65;
  }
  @keyframes floatUp { from { transform:translateY(0) rotate(0deg); opacity:0; } 12% {opacity:.7} to {transform:translateY(-115vh) rotate(500deg); opacity:0} }
  header { display:flex; align-items:center; justify-content:center; gap:1.2vw; min-height:8vh; text-align:center; }
  .title-icon { font-size:clamp(28px,3.3vw,58px); filter:drop-shadow(0 4px 0 #a85a10); }
  h1 { margin:0; font-size:clamp(26px,3.1vw,56px); line-height:1.1; letter-spacing:.08em; color:#fff2a8; text-shadow:0 3px 0 #9c5d16,0 0 22px rgba(255,211,86,.35); }
  .subtitle { text-align:center; margin:-.4vh 0 .3vh; color:#cce5ff; font-size:clamp(12px,1.15vw,21px); letter-spacing:.12em; }
  .status { position:absolute; top:1.1vh; right:1.5vw; font-size:clamp(10px,.8vw,15px); color:#c8e1ff; opacity:.85; }
  #board {
    flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(4,minmax(0,1fr)); gap:1.15vh 1vw;
  }
  .student-card {
    min-width:0; min-height:0; position:relative; overflow:hidden; display:flex; align-items:center;
    gap:.7vw; padding:.8vh .8vw; border-radius:18px;
    color:var(--ink); background:linear-gradient(150deg,#fff 0%,#eef6ff 65%,#dceaff 100%);
    border:2px solid rgba(255,255,255,.82); box-shadow:0 7px 0 rgba(0,0,0,.18), inset 0 2px 5px #fff;
    transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  }
  .student-card.top-rank {
    border-color:#ffe17a;
    box-shadow:0 0 0 2px rgba(255,212,94,.28),0 0 24px rgba(255,193,43,.65),0 7px 0 rgba(0,0,0,.2),inset 0 2px 5px #fff;
  }
  .student-card.top-rank::before {
    content:""; position:absolute; inset:-50%; pointer-events:none;
    background:linear-gradient(110deg,transparent 40%,rgba(255,224,107,.28) 50%,transparent 60%);
    transform:translateX(-60%); animation:shine 4s ease-in-out infinite;
  }
  @keyframes shine { 0%,55% {transform:translateX(-60%)} 100% {transform:translateX(60%)} }
  .rank { position:absolute; top:5px; left:7px; z-index:2; font-size:clamp(12px,1.1vw,21px); font-weight:900; color:#2e4771; }
  .crown { position:absolute; z-index:3; top:0; left:50%; transform:translateX(-50%) rotate(-5deg); font-size:clamp(18px,1.7vw,31px); filter:drop-shadow(0 2px 2px #b9790d); }
  .pig-wrap { width:43%; height:86%; min-width:0; position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pig {
    width:min(100%,150px); height:90%; max-height:150px; aspect-ratio:1/1; position:relative;
    border-radius:46% 46% 43% 43%;
    background:linear-gradient(145deg,#ffd0df 0%,#ff9fbd 40%,#ed6796 78%,#c83e72 100%);
    border:2px solid rgba(255,255,255,.9);
    box-shadow:inset 5px 6px 9px rgba(255,255,255,.85),inset -7px -9px 12px rgba(157,35,82,.22),0 5px 8px rgba(54,69,118,.25);
    overflow:hidden;
  }
  .ear { position:absolute; top:-2%; width:29%; height:30%; background:linear-gradient(145deg,#ffc4d8,#ed729a); border:2px solid #fff0f6; border-radius:65% 65% 25% 25%; z-index:0; }
  .ear.left { left:8%; transform:rotate(-28deg); } .ear.right { right:8%; transform:rotate(28deg); }
  .coin-fill {
    position:absolute; left:0; bottom:0; width:100%; height:0%;
    background:linear-gradient(180deg,rgba(255,225,101,.82),rgba(255,176,24,.96) 45%,#df830b);
    border-top:3px solid #fff0a1; transition:height 1s ease-in-out; overflow:hidden; z-index:1;
  }
  .coin-fill::before {
    content:"✦  ★  ✧  ✦  ★  ✧\A ★  ✦  ★  ✧  ✦  ★\A ✧  ★  ✦  ★  ✧  ✦";
    white-space:pre; position:absolute; inset:0; padding-top:3px; text-align:center;
    line-height:1.65; letter-spacing:2px; font-size:clamp(10px,.85vw,17px);
    color:#fff4a8; text-shadow:0 0 5px #fff4a8,0 1px 2px #bc7100; opacity:.98;
  }
  .coin-fill::after { content:""; position:absolute; left:0; right:0; top:-5px; height:9px; background:#fff2a2; border-radius:50%; box-shadow:0 0 12px #ffd64c; }
  .pig-face { position:absolute; inset:0; z-index:2; pointer-events:none; }
  .eye { position:absolute; top:36%; width:8%; height:8%; border-radius:50%; background:#263454; box-shadow:inset 1px 1px 1px #fff; }
  .eye.left {left:28%} .eye.right {right:28%}
  .snout { position:absolute; top:47%; left:35%; width:30%; height:20%; border-radius:50%; background:linear-gradient(145deg,#ffcada,#f46e9c); border:2px solid rgba(255,255,255,.8); box-shadow:inset -2px -3px 3px #d94c7d; }
  .nostril { position:absolute; top:36%; width:14%; height:28%; border-radius:50%; background:#a92d5a; }
  .nostril.left {left:25%} .nostril.right {right:25%}
  .shine-dot { position:absolute; top:12%; left:18%; width:25%; height:10%; border-radius:50%; background:rgba(255,255,255,.7); transform:rotate(-35deg); z-index:3; }
  .card-info { min-width:0; flex:1; z-index:2; display:flex; flex-direction:column; justify-content:center; gap:.35vh; }
  .student-name { font-size:clamp(15px,1.45vw,27px); font-weight:900; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .student-class { font-size:clamp(10px,.88vw,16px); color:#637b9e; font-weight:700; }
  .points { font-size:clamp(17px,1.75vw,32px); font-weight:900; color:#1255a1; line-height:1.05; white-space:nowrap; }
  .points small { font-size:.48em; color:#587293; }
  .progress-track { height:7px; border-radius:20px; background:#d5e2f4; overflow:hidden; width:100%; margin-top:.25vh; }
  .progress-bar { height:100%; width:0; border-radius:20px; background:linear-gradient(90deg,#ffd95b,#f6a915); transition:width 1s ease-in-out; }
  .empty-state { grid-column:1/-1; display:flex; align-items:center; justify-content:center; text-align:center; color:#e2efff; font-size:clamp(20px,2vw,36px); padding:20px; }
  footer { display:flex; justify-content:space-between; align-items:center; min-height:3.3vh; color:#c5ddff; font-size:clamp(10px,.85vw,16px); padding:0 .3vw; }
  footer strong { color:#ffe68a; }
  @media (max-aspect-ratio: 4/3) {
    .stage { padding:1vh 1vw; }
    #board { gap:.7vh .5vw; }
    .student-card { padding:.5vh .5vw; gap:.4vw; border-radius:12px; }
    .pig-wrap { width:38%; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="particle-layer" id="particles" aria-hidden="true"></div>
  <div class="status" id="status">正在準備排行榜…</div>
  <header><span class="title-icon">🐷</span><h1>小豬撲滿加分排行榜</h1><span class="title-icon">✨</span></header>
  <div class="subtitle">每天一點點，夢想存滿滿！</div>
  <main id="board" aria-live="polite">
    <div class="empty-state">正在載入學生的存錢進度…</div>
  </main>
  <footer><span>🎯 滿分目標：<strong id="target-label">300 點</strong></span><span id="page-label">第 1 頁</span><span id="updated">等待資料更新</span></footer>
</div>
<script>
/*
 * 【Google 試算表設定方式】
 * 1. 試算表第一列請使用欄位名稱：姓名、班級、目前點數。
 * 2. 在 Google 試算表選「檔案」→「共用」→「發布到網路」。
 * 3. 選擇要發布的工作表，格式選「逗號分隔值 (.csv)」，按「發布」。
 * 4. 複製產生的 CSV 網址，貼到下方 CSV_URL。
 *    若使用一般試算表網址，可從網址取得試算表 ID 與工作表 gid，
 *    並組成： https://docs.google.com/spreadsheets/d/試算表ID/export?format=csv&gid=工作表gid
 * 5. 網址必須能在無登入狀態下讀取；發布內容可能對知道網址的人公開，請勿放置敏感資料。
 * 6. 若瀏覽器因網路或跨來源限制無法讀取，請確認使用 Google 提供的公開 CSV 匯出網址。
 */
const CSV_URL = 'YOUR_GOOGLE_SHEETS_CSV_URL';
const TARGET_POINTS = 300;
const REFRESH_INTERVAL = 30_000;
const PAGE_SIZE = 12;
const PAGE_INTERVAL = 8000;

const board = document.getElementById('board');
const statusEl = document.getElementById('status');
const updatedEl = document.getElementById('updated');
const pageLabel = document.getElementById('page-label');
let allStudents = [];
let currentPage = 0;
let pageTimer = null;
document.getElementById('target-label').textContent = `${TARGET_POINTS} 點`;

function parseCSV(text) {
  // 支援逗號、雙引號、欄位內換行，以及 UTF-8 BOM。
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
      else quoted = !quoted;
    } else if (ch === ',' && !quoted) {
      row.push(cell.trim()); cell = '';
    } else if ((ch === '\n' || ch === '\r') && !quoted) {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell.trim());
      if (row.some(v => v !== '')) rows.push(row);
      row = []; cell = '';
    } else cell += ch;
  }
  if (cell.length || row.length) { row.push(cell.trim()); if (row.some(v => v !== '')) rows.push(row); }
  return rows;
}

function normalizeHeader(value) {
  return String(value || '').replace(/^\uFEFF/, '').trim().replace(/\s/g, '').toLowerCase();
}

function rowsToStudents(csvText) {
  const rows = parseCSV(csvText);
  if (rows.length < 2) return [];
  const headers = rows[0].map(normalizeHeader);
  const findIndex = aliases => headers.findIndex(h => aliases.includes(h));
  const nameIndex = findIndex(['姓名', '學生姓名', 'name']);
  const classIndex = findIndex(['班級', '年級班級', 'class', 'grade']);
  const pointsIndex = findIndex(['目前點數', '點數', '目前分數', 'points', 'score']);
  if (nameIndex < 0 || pointsIndex < 0) {
    throw new Error('找不到必要欄位，請確認第一列有「姓名」及「目前點數」。');
  }
  return rows.slice(1).map((r, i) => ({
    id: `${r[nameIndex] || 'student'}-${i}`,
    name: (r[nameIndex] || '').trim(),
    className: classIndex >= 0 ? (r[classIndex] || '').trim() : '',
    points: Math.max(0, Number(String(r[pointsIndex] || '0').replace(/,/g, '')) || 0)
  })).filter(s => s.name);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function pigMarkup() {
  return `<div class="pig-wrap" aria-hidden="true">
    <div class="ear left"></div><div class="ear right"></div>
    <div class="pig">
      <div class="coin-fill"></div>
      <div class="pig-face"><span class="shine-dot"></span><span class="eye left"></span><span class="eye right"></span>
        <span class="snout"><i class="nostril left"></i><i class="nostril right"></i></span>
      </div>
    </div>
  </div>`;
}
function cardMarkup(student, index) {
  const pct = Math.min(100, Math.max(0, student.points / TARGET_POINTS * 100));
  const crown = index < 3 ? '<span class="crown" aria-label="前三名">👑</span>' : '';
  return `<article class="student-card ${index < 3 ? 'top-rank' : ''}" data-id="${escapeHTML(student.id)}">
    <span class="rank">${index + 1}</span>${crown}
    ${pigMarkup()}
    <div class="card-info">
      <div class="student-name" title="${escapeHTML(student.name)}">${escapeHTML(student.name)}</div>
      <div class="student-class">${escapeHTML(student.className || '加油存點數')}</div>
      <div class="points"><span class="points-value">${student.points}</span><small> 點</small></div>
      <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
    </div>
  </article>`;
}

function renderStudents(students) {
  allStudents = [...students].sort((a, b) =>
    b.points - a.points || a.name.localeCompare(b.name, 'zh-Hant')
  );

  if (!allStudents.length) {
    board.innerHTML = '<div class="empty-state">目前沒有學生資料，請檢查試算表內容。</div>';
    pageLabel.textContent = '第 1 頁';
    return;
  }

  const totalPages = Math.ceil(allStudents.length / PAGE_SIZE);
  currentPage = currentPage % totalPages;
  renderCurrentPage();
}

function renderCurrentPage() {
  const totalPages = Math.max(1, Math.ceil(allStudents.length / PAGE_SIZE));
  if (currentPage >= totalPages) currentPage = 0;

  const visible = allStudents.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
  board.innerHTML = visible.map(cardMarkup).join('');

  requestAnimationFrame(() => {
    visible.forEach(s => {
      const card = [...board.querySelectorAll('.student-card')]
        .find(el => el.dataset.id === s.id);
      if (!card) return;
      const pct = Math.min(100, Math.max(0, s.points / TARGET_POINTS * 100));
      card.querySelector('.coin-fill').style.height = `${pct}%`;
    });
  });

  pageLabel.textContent = `第 ${currentPage + 1} / ${totalPages} 頁`;
}

function startAutoPaging() {
  if (pageTimer) clearInterval(pageTimer);
  pageTimer = setInterval(() => {
    const totalPages = Math.ceil(allStudents.length / PAGE_SIZE);
    if (totalPages > 1) {
      currentPage = (currentPage + 1) % totalPages;
      renderCurrentPage();
    }
  }, PAGE_INTERVAL);
}

async function refreshData() {
  if (!CSV_URL || CSV_URL === 'YOUR_GOOGLE_SHEETS_CSV_URL') {
    statusEl.textContent = '請先設定 Google 試算表 CSV 網址';
    updatedEl.textContent = '尚未連線';
    return;
  }
  try {
    statusEl.textContent = '正在同步資料…';
    const response = await fetch(CSV_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const csvText = await response.text();
    const students = rowsToStudents(csvText);
    renderStudents(students);
    startAutoPaging();
    const now = new Date();
    updatedEl.textContent = `更新時間 ${now.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}`;
    statusEl.textContent = `已同步 ${students.length} 位學生`;
  } catch (error) {
    console.error('排行榜更新失敗：', error);
    statusEl.textContent = '資料連線失敗，將自動重試';
    updatedEl.textContent = '請檢查 CSV 網址與網路';
  }
}

function createParticles() {
  const layer = document.getElementById('particles');
  for (let i = 0; i < 34; i++) {
    const p = document.createElement('span');
    p.className = 'coin-particle';
    p.style.left = `${Math.random() * 100}%`;
    p.style.animationDuration = `${9 + Math.random() * 15}s`;
    p.style.animationDelay = `${-Math.random() * 20}s`;
    p.style.transform = `scale(${.55 + Math.random() * .9})`;
    layer.appendChild(p);
  }
}
createParticles();
refreshData();
setInterval(refreshData, REFRESH_INTERVAL);
</script>
</body>
</html>
