<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大南小豬農場</title>
    <style>
        /* ==========================================
           1. 全域與重置設定
           ========================================== */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 讓畫面永遠置中，並使用深色背景襯托 16:9 的主畫面 */
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* ==========================================
           2. 1920x1080 畫布與背景設定
           ========================================== */
        #tv-screen {
            width: 1920px;
            height: 1080px;
            /* 農場背景：藍天 -> 白雲/遠山 -> 簡潔低對比草地 */
            background: linear-gradient(to bottom, #7EC8E3 0%, #CDEFF9 25%, #A2E0AD 45%, #88D49E 100%);
            position: relative;
            transform-origin: center center;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            /* 4% 安全邊界 (1920*0.04 = 約 76px) */
            padding: 76px;
            display: flex;
            flex-direction: column;
        }

        /* 簡單的背景裝飾 (白雲) */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
            opacity: 0.6;
            filter: blur(2px);
            z-index: 0;
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: #fff; border-radius: 50%;
        }
        .cloud1 { top: 5%; left: 10%; width: 200px; height: 60px; }
        .cloud1::before { width: 100px; height: 100px; top: -40px; left: 20px; }
        .cloud1::after { width: 80px; height: 80px; top: -30px; left: 100px; }
        .cloud2 { top: 10%; right: 15%; width: 250px; height: 70px; }
        .cloud2::before { width: 120px; height: 120px; top: -50px; left: 30px; }
        .cloud2::after { width: 90px; height: 90px; top: -40px; left: 130px; }

        /* ==========================================
           3. 標題區 (13% 高度)
           ========================================== */
        header {
            height: 140px; /* 約 13% */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 10;
        }

        .wood-sign {
            background: linear-gradient(to bottom, #C78A4A, #A66A35);
            border: 6px solid #6E4117;
            border-radius: 20px;
            padding: 15px 80px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.3);
            position: relative;
        }
        /* 吊牌繩索 */
        .wood-sign::before, .wood-sign::after {
            content: '';
            position: absolute;
            top: -76px;
            width: 8px;
            height: 80px;
            background: #C78A4A;
            border-left: 2px solid #6E4117;
            border-right: 2px solid #6E4117;
            z-index: -1;
        }
        .wood-sign::before { left: 40px; }
        .wood-sign::after { right: 40px; }

        .wood-sign h1 {
            color: #FFF9E6;
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 3px 3px 0px #5E3610, 5px 5px 15px rgba(0,0,0,0.4);
        }

        /* ==========================================
           4. 主展示區 (4 欄 × 3 列)
           ========================================== */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 24px;
            margin: 20px 0;
            z-index: 10;
        }

        .student-card {
            background: #FDFAF5; /* 暖白色 */
            border-radius: 24px;
            box-shadow: 0 8px 16px rgba(0, 80, 0, 0.15), inset 0 -4px 0 rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            position: relative;
        }

        /* 點數設計 */
        .points {
            font-size: 52px;
            font-weight: 900;
            color: #E67E22; /* 溫暖的橘色系 */
            line-height: 1.1;
        }

        /* 姓名設計 */
        .name {
            font-size: 44px;
            font-weight: 900;
            color: #3E2723; /* 深棕色，高對比 */
            line-height: 1.1;
            background: #F1E5D1;
            padding: 4px 24px;
            border-radius: 30px;
        }

        /* 小豬容器 */
        .pig-container {
            position: relative;
            width: 140px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* 小豬 SVG 樣式 */
        .pig-svg {
            width: 100%;
            height: 100%;
            drop-shadow: 0 10px 10px rgba(0,0,0,0.2);
        }

        /* 配件 */
        .accessory {
            position: absolute;
            font-size: 40px;
            z-index: 5;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* ==========================================
           5. 動畫效果
           ========================================== */
        /* 小豬微搖擺 */
        .animating .pig-svg {
            animation: pigWobble 1.5s ease-in-out infinite;
        }
        @keyframes pigWobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-4deg) scale(1.02); }
            75% { transform: rotate(4deg) scale(1.02); }
        }

        /* 金幣掉落 */
        .coin-drop {
            position: absolute;
            top: -40px;
            width: 30px;
            height: 30px;
            background: #FFD700;
            border: 3px solid #DAA520;
            border-radius: 50%;
            color: #DAA520;
            font-weight: bold;
            font-size: 18px;
            line-height: 24px;
            text-align: center;
            opacity: 0;
            z-index: 10;
        }
        .animating .coin-drop {
            animation: coinFall 1.5s ease-in infinite;
        }
        @keyframes coinFall {
            0% { transform: translateY(-30px); opacity: 0; }
            30% { opacity: 1; }
            70% { transform: translateY(40px); opacity: 1; }
            100% { transform: translateY(60px); opacity: 0; }
        }

        /* ==========================================
           6. 底部狀態列
           ========================================== */
        footer {
            height: 60px;
            background: rgba(253, 250, 245, 0.9);
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            font-size: 24px;
            font-weight: 700;
            color: #2E4053;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .footer-left { display: flex; align-items: center; gap: 10px; }
        .sheet-icon { color: #0F9D58; font-size: 28px; }
        .update-time { font-size: 20px; color: #7F8C8D; margin-left: 10px; }

        .footer-center {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 0 40px;
        }
        .progress-bar-bg {
            width: 100%;
            max-width: 400px;
            height: 12px;
            background: #E5E8E8;
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #2ECC71;
            width: 0%;
        }

        .footer-right { display: flex; align-items: center; gap: 15px; }
        .timer-info { font-size: 20px; color: #7F8C8D; }
    </style>
</head>
<body>

    <!-- 1920x1080 畫布容器 -->
    <div id="tv-screen">
        <!-- 背景雲朵 -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <!-- 標題 -->
        <header>
            <div class="wood-sign">
                <h1>大南小豬農場</h1>
            </div>
        </header>

        <!-- 卡片網格區 -->
        <main id="card-grid"></main>

        <!-- 頁尾狀態列 -->
        <footer>
            <div class="footer-left">
                <span class="sheet-icon">📊</span>
                <span>Google 試算表</span>
                <span class="update-time" id="update-time">最後更新 --:--</span>
            </div>
            <div class="footer-center">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>
            <div class="footer-right">
                <span id="page-info">第 1 / 1 頁</span>
                <span class="timer-info">(每 15 秒自動輪播)</span>
            </div>
        </footer>
    </div>

    <script>
        /* ==========================================
           Google 試算表連動設定教學
           ==========================================
           1. 建立一個 Google 試算表，欄位依序為： [學生ID, 姓名, 點數]
           2. 點擊右上角「共用」->「發布到網路」
           3. 選擇「整份文件」或「特定工作表」，格式選擇「逗號分隔值 (.csv)」
           4. 點擊發布，複製獲得的網址。
           5. 將下方的 SHEET_CSV_URL 換成您的網址即可。
           
           (目前提供空白網址，系統會自動使用下方的 MOCK_DATA 假資料作為展示)
        */
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTs0jXCVpoDZwMflTWAedJkzdyRMJNM5uPJx2ODUQXHWPe3hneozfAc3KNSH9pWrygWJl8aKcinEtM9/pub?output=csv"; 

        // 假資料 (當連線失敗或未設定網址時使用，包含 2、3、4 字姓名及不同位數點數)
        const MOCK_DATA = [
            { id: '101', name: '王小晴', points: 1280 },
            { id: '102', name: '林一', points: 95 },
            { id: '103', name: '陳大山', points: 3450 },
            { id: '104', name: '歐陽子萱', points: 880 },
            { id: '105', name: '李明', points: 150 },
            { id: '106', name: '張心怡', points: 2100 },
            { id: '107', name: '周杰', points: 760 },
            { id: '108', name: '司馬中原', points: 405 },
            { id: '109', name: '吳美玲', points: 5600 },
            { id: '110', name: '黃冠宇', points: 320 },
            { id: '111', name: '鄭成功', points: 9999 },
            { id: '112', name: '劉備', points: 120 },
            { id: '113', name: '趙子龍', points: 850 },
            { id: '114', name: '諸葛孔明', points: 2400 }
        ];

        // 固定的配件清單，透過學號決定，確保同一學生的配件不變
        const ACCESSORIES = ['🎓', '🎀', '👓', '👒', '🌸', '🧣', '👑', '🧢'];

        // 系統狀態
        let studentsData = [];
        let currentPage = 0;
        const ITEMS_PER_PAGE = 12;
        const PAGE_DURATION = 15000; // 15秒換頁
        let carouselTimer = null;
        let progressAnimation = null;
        let animationStartTime = 0;

        // 視窗自適應縮放邏輯 (確保 1920x1080 完整呈現)
        function resizeScreen() {
            const screen = document.getElementById('tv-screen');
            const scaleX = window.innerWidth / 1920;
            const scaleY = window.innerHeight / 1080;
            const scale = Math.min(scaleX, scaleY); // 保持 16:9 比例
            screen.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeScreen);
        resizeScreen();

        // 繪製小豬的 SVG 模板 (圓潤粉紅風格)
        const pigSVG = `
            <svg class="pig-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- 身體 -->
                <circle cx="50" cy="55" r="40" fill="url(#pigGrad)" />
                <!-- 耳朵 -->
                <path d="M 20 30 Q 15 15 30 20 Z" fill="#FF94A8" />
                <path d="M 80 30 Q 85 15 70 20 Z" fill="#FF94A8" />
                <!-- 眼睛 -->
                <circle cx="35" cy="45" r="4" fill="#3E2723" />
                <circle cx="65" cy="45" r="4" fill="#3E2723" />
                <!-- 鼻子 -->
                <ellipse cx="50" cy="60" rx="14" ry="10" fill="#FF8299" />
                <circle cx="45" cy="60" r="2" fill="#D32F2F" />
                <circle cx="55" cy="60" r="2" fill="#D32F2F" />
                <!-- 投幣孔 -->
                <rect x="42" y="10" width="16" height="4" rx="2" fill="#D85A74" />
                <!-- 漸層定義 -->
                <defs>
                    <radialGradient id="pigGrad" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#FFD1DC"/>
                        <stop offset="70%" stop-color="#FF94A8"/>
                        <stop offset="100%" stop-color="#E86A83"/>
                    </radialGradient>
                </defs>
            </svg>
        `;

        // 依據 ID 取得固定配件
        function getAccessory(idStr) {
            // 將 ID 轉為數字，若有英文字母則取其 charCode 總和
            let num = 0;
            for (let i = 0; i < idStr.length; i++) {
                num += idStr.charCodeAt(i);
            }
            return ACCESSORIES[num % ACCESSORIES.length];
        }

        // 格式化數字 (加入千分位)
        function formatPoints(points) {
            return Number(points).toLocaleString('en-US');
        }

        // 更新畫面資料
        function renderPage() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = ''; // 清空

            const totalPages = Math.ceil(studentsData.length / ITEMS_PER_PAGE) || 1;
            document.getElementById('page-info').textContent = `第 ${currentPage + 1} / ${totalPages} 頁`;

            const startIdx = currentPage * ITEMS_PER_PAGE;
            const pageData = studentsData.slice(startIdx, startIdx + ITEMS_PER_PAGE);

            // 隨機選出 0~2 位學生播放投幣動畫 (只在當前頁)
            const animatingIndices = [];
            const numAnimations = Math.floor(Math.random() * 3); // 0, 1, or 2
            while(animatingIndices.length < numAnimations && pageData.length > 0) {
                const rand = Math.floor(Math.random() * pageData.length);
                if(!animatingIndices.includes(rand)) animatingIndices.push(rand);
            }

            // 產生卡片
            pageData.forEach((student, index) => {
                const isAnimating = animatingIndices.includes(index);
                const accessory = getAccessory(student.id);

                const card = document.createElement('div');
                card.className = 'student-card';
                card.innerHTML = `
                    <div class="points">${formatPoints(student.points)} 點</div>
                    <div class="pig-container ${isAnimating ? 'animating' : ''}">
                        ${isAnimating ? '<div class="coin-drop">$</div>' : ''}
                        <div class="accessory">${accessory}</div>
                        ${pigSVG}
                    </div>
                    <div class="name">${student.name}</div>
                `;
                grid.appendChild(card);
            });

            // 如果該頁不足 12 人，填補空白隱形卡片以維持版面網格不變形
            const emptySlots = ITEMS_PER_PAGE - pageData.length;
            for (let i = 0; i < emptySlots; i++) {
                const emptyCard = document.createElement('div');
                emptyCard.style.visibility = 'hidden'; 
                grid.appendChild(emptyCard);
            }
        }

        // 進度條動畫邏輯
        function updateProgressBar(timestamp) {
            if (!animationStartTime) animationStartTime = timestamp;
            const elapsed = timestamp - animationStartTime;
            let progress = (elapsed / PAGE_DURATION) * 100;
            
            if (progress >= 100) {
                progress = 100;
            }
            
            document.getElementById('progress-bar').style.width = `${progress}%`;

            if (progress < 100) {
                progressAnimation = requestAnimationFrame(updateProgressBar);
            }
        }

        // 輪播邏輯
        function startCarousel() {
            if (carouselTimer) clearInterval(carouselTimer);
            if (progressAnimation) cancelAnimationFrame(progressAnimation);

            const totalPages = Math.ceil(studentsData.length / ITEMS_PER_PAGE) || 1;
            
            const nextSlide = () => {
                currentPage = (currentPage + 1) % totalPages;
                renderPage();
                
                // 重置進度條
                animationStartTime = 0;
                cancelAnimationFrame(progressAnimation);
                progressAnimation = requestAnimationFrame(updateProgressBar);
            };

            // 初始化第一頁與進度條
            renderPage();
            animationStartTime = 0;
            progressAnimation = requestAnimationFrame(updateProgressBar);

            // 設定定時器
            carouselTimer = setInterval(nextSlide, PAGE_DURATION);
        }

        // 解析 CSV 資料的簡易函數
        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            const result = [];
            // 假設第一行是標題，從第二行開始讀取
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(',');
                if (cols.length >= 3) {
                    result.push({
                        id: cols[0].trim(),
                        name: cols[1].trim(),
                        points: parseInt(cols[2].trim(), 10) || 0
                    });
                }
            }
            return result;
        }

        // 取得資料
        async function fetchGoogleSheetsData() {
            try {
                if (!SHEET_CSV_URL) {
                    throw new Error("未設定 CSV 網址，使用示範資料");
                }
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error("網路連線失敗");
                const csvText = await response.text();
                studentsData = parseCSV(csvText);
            } catch (error) {
                console.log(error.message);
                // 連線失敗或未設定時，使用假資料
                if(studentsData.length === 0) {
                    studentsData = MOCK_DATA;
                }
            } finally {
                // 更新時間顯示
                const now = new Date();
                const timeString = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('update-time').textContent = `最後更新 ${timeString}`;
                
                // 啟動或重啟輪播
                currentPage = 0;
                startCarousel();
            }
        }

        // 初始化執行
        fetchGoogleSheetsData();

        // 為了模擬即時更新，每 5 分鐘重新抓取一次資料
        setInterval(fetchGoogleSheetsData, 5 * 60 * 1000);

    </script>
</body>
</html>
