<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大南小豬農場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a2410;
  --cream:#fdefcb;
  --cream-2:#f9e2b0;
  --depth:44px;            /* 小豬離卡片底板的 Z 距離 */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  margin:0;overflow:hidden;
  background:radial-gradient(circle at 50% -10%,#fffaf0 0,#ffeccb 55%,#fbdca4 100%);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
/* 固定 1920x1080 (16:9) 設計稿，依螢幕等比縮放並置中 */
.tv{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--k,1));
  display:flex;flex-direction:column;align-items:center;padding-top:22px}

/* ---------- 標題 ---------- */
.title{width:540px;perspective:900px;margin-bottom:14px}
.title img{width:100%;display:block;transform-style:preserve-3d;
  transition:transform .2s ease-out;filter:drop-shadow(0 12px 12px rgba(110,60,15,.3))}

/* ---------- 版型：3 x 2 ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;width:1440px}

/* ---------- 卡片 ---------- */
.card{
  position:relative;aspect-ratio:1/.82;
  container-type:inline-size;          /* 內部用 cqw 讓所有尺寸隨卡片縮放 */
  perspective:1000px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  --rx:0deg;--ry:0deg;--lift:0;--gx:50%;--gy:50%;--sx:0;--sy:0;
}
.scene{
  position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateX(var(--rx)) rotateY(var(--ry)) scale(calc(1 + var(--lift)*.05));
  will-change:transform;
}
.scene > *{position:absolute}

/* 第 0 層：底板 */
.plate{
  inset:0;border-radius:9cqw;
  background:linear-gradient(160deg,#fff6df,var(--cream) 45%,var(--cream-2));
  box-shadow:inset 0 0 0 .8cqw rgba(255,255,255,.7),inset 0 -2cqw 5cqw rgba(200,140,60,.18),
             0 2.5cqw 5cqw rgba(140,80,20,calc(.22 - var(--lift)*.08));
}

/* 第 1 層：地面陰影（隨傾斜反向位移、浮起時縮小變淡） */
.floor{
  left:16%;right:12%;top:60%;height:9%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(110,60,15,.5),transparent 70%);
  filter:blur(1.2cqw);
  transform:translateZ(2px) translate(calc(var(--sx)*1cqw),calc(var(--sy)*.6cqw))
            scale(calc(1 - var(--lift)*.2),calc(1 - var(--lift)*.12));
  opacity:calc(.95 - var(--lift)*.35);
}

/* 第 2 層：彩色光暈 */
.aura{
  left:14%;right:10%;top:6%;height:56%;border-radius:50%;
  background:radial-gradient(circle,var(--c1),transparent 68%);
  opacity:.5;filter:blur(2cqw);transform:translateZ(14px) scale(calc(1 + var(--lift)*.1));
}

/* 第 3 層：小豬（多層疊出厚度） */
.pig{
  left:15%;width:68%;top:4%;aspect-ratio:938/800;
  transform-style:preserve-3d;transform:translateZ(var(--depth));
}
.pig img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.pig .d1{transform:translateZ(-22px);filter:brightness(.55) saturate(1.3)}
.pig .d2{transform:translateZ(-15px);filter:brightness(.68) saturate(1.2)}
.pig .d3{transform:translateZ(-8px);filter:brightness(.82)}
.pig .main{transform:translateZ(0);filter:drop-shadow(0 1.2cqw 1.2cqw rgba(90,40,0,.2))}
.card:not(.active) .pig{animation:bob 3.8s ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes bob{
  0%,100%{transform:translateZ(var(--depth)) translateY(0) rotate(-.6deg)}
  50%{transform:translateZ(calc(var(--depth) + 8px)) translateY(-1.6cqw) rotate(.6deg)}
}

/* 第 4 層：標籤膠囊 */
.pill{
  left:5%;right:5%;bottom:4%;height:19%;border-radius:99px;
  display:flex;align-items:center;justify-content:center;gap:5cqw;
  background:linear-gradient(#fff3d4,#fbe4b4);
  box-shadow:inset 0 0 0 .7cqw rgba(255,255,255,.85),inset 0 -1cqw 1.6cqw rgba(190,130,50,.25),
             0 1.2cqw 2cqw rgba(120,70,20,.22);
  color:var(--ink);font-weight:900;white-space:nowrap;
  transform:translateZ(calc(var(--depth) * .55));
}
.pill .name{font-size:9.6cqw;letter-spacing:.3cqw}
.pill .pts{font-size:10.4cqw;font-variant-numeric:tabular-nums}
.pill .pts small{font-size:6.6cqw;margin-left:.8cqw}

/* 第 5 層：漂浮金幣與星光 */
.coin{
  width:var(--s,7cqw);aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 34% 28%,#fff6bd 0,#f8cb3d 50%,#c98a10 100%);
  box-shadow:inset 0 0 0 .6cqw #e3a915,inset 0 -.6cqw .8cqw rgba(150,90,0,.35),0 1cqw 1.4cqw rgba(110,60,10,.28);
  display:grid;place-items:center;color:#c98a10;font-size:calc(var(--s,7cqw)*.52);line-height:1;
  transform:translateZ(var(--z,100px));
  animation:float 3.2s ease-in-out infinite;animation-delay:var(--d,0s);
}
.coin::before{content:"★"}
@keyframes float{
  0%,100%{translate:0 0;rotate:-8deg}
  50%{translate:0 -2cqw;rotate:10deg}
}
.spark{
  font-size:6cqw;color:#ffd84a;text-shadow:0 0 1.5cqw #fff3a0;pointer-events:none;
  transform:translateZ(var(--z,140px));animation:twinkle 2.2s ease-in-out infinite;animation-delay:var(--d,0s)
}
@keyframes twinkle{0%,100%{opacity:.25;scale:.6}50%{opacity:1;scale:1.15}}

/* 投幣動畫：金幣從存錢孔掉入 */
.drop{
  left:50%;top:-8%;--s:7.5cqw;
  transform:translateZ(calc(var(--depth) + 20px));
  animation:slot 2.6s cubic-bezier(.5,0,.8,.6) infinite;animation-delay:var(--dd,0s);opacity:0
}
@keyframes slot{
  0%{translate:0 0;rotate:0deg;opacity:0}
  10%{opacity:1}
  62%{translate:0 17cqw;rotate:540deg;opacity:1}
  72%,100%{translate:0 19cqw;rotate:620deg;opacity:0}
}
.ding{
  right:6%;top:2%;font-size:8cqw;font-weight:900;color:#ff9a1f;
  -webkit-text-stroke:.5cqw #fff;paint-order:stroke fill;transform:translateZ(150px) rotate(8deg);
  animation:ding 2.6s ease-out infinite;opacity:0;pointer-events:none
}
@keyframes ding{0%,58%{opacity:0;scale:.6}66%{opacity:1;scale:1.2}80%{opacity:1;scale:1}100%{opacity:0}}

/* 第 6 層：光澤 */
.glare{
  inset:0;border-radius:9cqw;pointer-events:none;transform:translateZ(170px);
  background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.4),transparent 55%);
  opacity:calc(var(--lift)*.95);
}

/* 點擊掉落的錢幣 */
.burst{position:fixed;width:26px;height:26px;border-radius:50%;pointer-events:none;z-index:99;
  background:radial-gradient(circle at 35% 30%,#fff3b0,#f6c230 55%,#c98a10);
  box-shadow:inset 0 0 0 3px #e5a912,0 3px 6px rgba(0,0,0,.25);
  animation:burst 1.1s cubic-bezier(.3,.7,.5,1) forwards}
@keyframes burst{
  0%{transform:translate(0,0) rotateY(0);opacity:0}
  12%{opacity:1}
  100%{transform:translate(var(--bx),var(--by)) rotateY(900deg);opacity:0}
}

@media(prefers-reduced-motion:reduce){
  .pig,.coin,.spark,.drop,.ding{animation:none!important}
  .drop,.ding{display:none}
}

/* ---------- 輪播 ---------- */
.stage{width:1440px}
.grid.leaving .card{animation:leave .45s ease-in both}
.card.enter{animation:enter .8s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i)*90ms)}
.card.empty{visibility:hidden;pointer-events:none}
@keyframes enter{from{opacity:0;transform:translateY(40px) rotateX(-28deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-30px) rotateX(20deg) scale(.92)}}
.pager{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:22px;color:var(--ink);font-weight:900}
.pager button{border:0;cursor:pointer;width:52px;height:52px;border-radius:50%;font:inherit;font-size:26px;color:var(--ink);
  background:linear-gradient(#fff3d4,#fbe4b4);box-shadow:inset 0 0 0 2px #fff,0 4px 8px rgba(120,70,20,.22);transition:transform .15s}
.pager button:hover{transform:scale(1.1)}
.dots{display:flex;gap:12px;align-items:center}
.dots i{width:15px;height:15px;border-radius:50%;background:#e8c88a;cursor:pointer;transition:.25s}
.dots i.on{width:48px;border-radius:99px;background:linear-gradient(90deg,#f3a21b,#e07a0f);position:relative;overflow:hidden}
.dots i.on::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.55);transform-origin:left;
  animation:fill var(--sec,30s) linear forwards}
.dots.paused i.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.status{position:absolute;right:28px;bottom:14px;margin:0;font-size:18px;color:#9a6b36;font-weight:700;text-align:right}
.status.warn{color:#c4521a}
</style>
</head>
<body>

<div class="tv" id="tv">
<div class="title" data-title><img data-src="title" alt="大南小豬農場　每天一點點，夢想存滿滿！"></div>

<section class="stage">
  <main class="grid" id="grid"></main>
  <nav class="pager" id="pager" hidden>
    <button id="prev" aria-label="上一頁">‹</button>
    <div class="dots" id="dots"></div>
    <button id="next" aria-label="下一頁">›</button>
  </nav>
</section>
<p class="status" id="status"></p>
</div>

<script>
/* =====================================================================
   ★ 設定區：只需要改這裡
   ===================================================================== */
const CONFIG = {
  // 貼上你的 Google 試算表網址（分享設為「知道連結的任何人可檢視」，或使用「發布到網路」的 CSV 連結）
  // 留空 → 使用下方示範資料
  SHEET_URL: '',
  SHEET_NAME: '',        // 選填：分頁名稱（不填則讀第一個分頁，或網址中的 gid）
  PER_PAGE: 6,           // 每頁幾隻小豬（3 x 2）
  PAGE_SECONDS: 30,      // 每幾秒換頁，同時重新抓一次試算表
  SORT_DESC: false,      // false = 依試算表的姓名順序排列；true = 點數高的排前面

  // 點數 → 撲滿（金幣高度）對照表，由高到低排列：點數 >= min 就使用該撲滿
  TIERS: [
    { min: 900, img: 'p0', color: '#ff9fb4', top: true  },  // 粉紅：金幣滿到孔口
    { min: 720, img: 'p1', color: '#c58cf2' },               // 紫
    { min: 550, img: 'p2', color: '#7fe3a3' },               // 綠
    { min: 360, img: 'p3', color: '#ffa57a' },               // 橘
    { min: 180, img: 'p4', color: '#7cc4f5' },               // 藍
    { min:   0, img: 'p5', color: '#ffd860' },               // 黃：金幣最少
  ],
};

// 示範資料（SHEET_URL 留空或讀取失敗時使用）
const DEMO = [
  ['宸諺',900],['秀謙',720],['書宇',550],['靜羽',360],['楷樂',180],['妍安',80],
  ['子晴',1020],['承恩',810],['若瑜',640],['柏翰',470],['語彤',260],['冠廷',130],['沛珊',40],['品睿',600],
].map(([name,points]) => ({name,points}));

/* ===================== 試算表讀取 ===================== */
function toCsvUrl(u) {
  u = u.trim();
  if (/output=csv|tqx=out:csv/.test(u)) return u;
  if (/\/pubhtml/.test(u)) return u.replace(/\/pubhtml.*/, '/pub?output=csv');
  if (/\/pub(\?|$)/.test(u)) return u + (u.includes('?') ? '&' : '?') + 'output=csv';
  const id = (u.match(/\/d\/([\w-]+)/) || [])[1];
  if (!id) throw new Error('看不懂的試算表網址');
  const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1];
  let out = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`;
  if (CONFIG.SHEET_NAME) out += '&sheet=' + encodeURIComponent(CONFIG.SHEET_NAME);
  else if (gid) out += '&gid=' + gid;
  return out;
}

function parseCSV(text) {            // 支援引號、逗號、換行
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') q = false;
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

const num = v => Number(String(v ?? '').replace(/[^\d.\-]/g, ''));

async function loadPeople() {
  if (!CONFIG.SHEET_URL) return { people: DEMO, demo: true };
  const url = toCsvUrl(CONFIG.SHEET_URL);
  const res = await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const rows = parseCSV(await res.text());
  if (!rows.length) throw new Error('試算表是空的');
  let ni = 0, pi = 1, start = 0;
  const head = rows[0];
  if (isNaN(num(head[1])) || head[1].trim() === '' || /[^\d.,\s-]/.test(head[1])) {   // 第一列是標題
    start = 1;
    const f = re => head.findIndex(h => re.test(h));
    if (f(/姓名|名字|name/i) >= 0) ni = f(/姓名|名字|name/i);
    if (f(/點數|點|分數|point|score/i) >= 0) pi = f(/點數|點|分數|point|score/i);
  }
  const people = rows.slice(start)
    .map(r => ({ name: (r[ni] || '').trim(), points: num(r[pi]) }))
    .filter(p => p.name && Number.isFinite(p.points));
  if (!people.length) throw new Error('找不到有效的姓名/點數');
  return { people, demo: false };
}

/* ===================== 點數 → 撲滿 ===================== */
const tierOf = pts => CONFIG.TIERS.find(t => pts >= t.min) || CONFIG.TIERS[CONFIG.TIERS.length - 1];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cardHTML(p, i) {
  if (!p) return '<article class="card empty"></article>';
  const t = tierOf(p.points);
  return `<article class="card enter" data-tilt style="--c1:${t.color};--delay:-${(i*.7).toFixed(1)}s;--i:${i}" aria-label="${esc(p.name)} ${p.points}點">
    <div class="scene">
      <div class="plate"></div><div class="floor"></div><div class="aura"></div>
      <div class="pig">
        <img class="d1" src="${IMGS[t.img]}" alt=""><img class="d2" src="${IMGS[t.img]}" alt=""><img class="d3" src="${IMGS[t.img]}" alt="">
        <img class="main" src="${IMGS[t.img]}" alt="${esc(p.name)}的小豬撲滿">
      </div>
      <div class="coin drop" style="--dd:-${(i*.5).toFixed(1)}s"></div>
      <div class="coin" style="left:4%;top:12%;--s:6.5cqw;--z:18px;--d:-.4s"></div>
      <div class="coin" style="right:5%;top:36%;--s:5.5cqw;--z:16px;--d:-1.4s"></div>
      <div class="coin" style="left:3%;top:52%;--s:5cqw;--z:14px;--d:-2.2s"></div>
      <div class="coin" style="right:8%;top:8%;--s:4.6cqw;--z:20px;--d:-.9s"></div>
      <div class="spark" style="left:9%;top:36%;--z:18px;--d:-.6s">✦</div>
      <div class="spark" style="right:6%;top:20%;--z:18px;--d:-1.5s">✦</div>
      <div class="spark" style="right:10%;top:56%;--z:16px;--d:-.2s">✦</div>
      ${t.top ? '<div class="ding">叮當!</div>' : ''}
      <div class="pill"><span class="name">${esc(p.name)}</span><span class="pts"><span data-count="${p.points}">0</span><small>點</small></span></div>
      <div class="glare"></div>
    </div></article>`;
}

/* ===================== 3D 傾斜（lerp 平滑）===================== */
const MAX = 15;
function initTilt(card) {
  const t = {rx:0, ry:0, gx:50, gy:50, lift:0}, c = {...t};
  let raf = null;
  const tick = () => {
    let moving = false;
    for (const k in t) {
      const d = t[k] - c[k];
      if (Math.abs(d) > .01) { c[k] += d * .14; moving = true; } else c[k] = t[k];
    }
    const s = card.style;
    s.setProperty('--rx', c.rx.toFixed(2) + 'deg');
    s.setProperty('--ry', c.ry.toFixed(2) + 'deg');
    s.setProperty('--gx', c.gx.toFixed(1) + '%');
    s.setProperty('--gy', c.gy.toFixed(1) + '%');
    s.setProperty('--lift', c.lift.toFixed(3));
    s.setProperty('--sx', (-c.ry * 1.3).toFixed(2));
    s.setProperty('--sy', (c.rx * .8).toFixed(2));
    raf = moving ? requestAnimationFrame(tick) : null;
  };
  const run = () => { if (!raf) raf = requestAnimationFrame(tick); };
  card.addEventListener('pointerenter', () => { card.classList.add('active'); t.lift = 1; run(); });
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    t.ry = (px - .5) * 2 * MAX; t.rx = (.5 - py) * 2 * MAX; t.gx = px * 100; t.gy = py * 100; run();
  });
  card.addEventListener('pointerleave', () => {
    card.classList.remove('active'); Object.assign(t, {rx:0, ry:0, gx:50, gy:50, lift:0}); run();
  });
  card.addEventListener('click', e => {
    for (let n = 0; n < 8; n++) {
      const b = document.createElement('div'); b.className = 'burst';
      b.style.left = e.clientX - 13 + 'px'; b.style.top = e.clientY - 13 + 'px';
      b.style.setProperty('--bx', (Math.random() * 160 - 80) + 'px');
      b.style.setProperty('--by', (60 + Math.random() * 90) + 'px');
      b.style.animationDelay = n * 40 + 'ms';
      document.body.appendChild(b); setTimeout(() => b.remove(), 1500);
    }
  });
}

function countUp(el) {
  const end = +el.dataset.count, t0 = performance.now(), dur = 1200;
  const step = now => {
    const p = Math.min((now - t0) / dur, 1);
    el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ===================== 輪播 ===================== */
const $ = id => document.getElementById(id);
let people = [], page = 0, timer = null, busy = false;
const pages = () => Math.max(1, Math.ceil(people.length / CONFIG.PER_PAGE));

function renderPage() {
  const grid = $('grid');
  const slice = people.slice(page * CONFIG.PER_PAGE, (page + 1) * CONFIG.PER_PAGE);
  grid.classList.remove('leaving');
  grid.innerHTML = Array.from({length: CONFIG.PER_PAGE}, (_, i) => cardHTML(slice[i], i)).join('');
  grid.querySelectorAll('[data-tilt]').forEach(initTilt);
  grid.querySelectorAll('[data-count]').forEach(countUp);
  renderPager();
}

function renderPager() {
  const n = pages();
  $('pager').hidden = n < 2;
  const dots = $('dots');
  dots.style.setProperty('--sec', CONFIG.PAGE_SECONDS + 's');
  dots.innerHTML = Array.from({length: n}, (_, i) => `<i data-p="${i}" class="${i === page ? 'on' : ''}"></i>`).join('');
}

async function goTo(next, withReload = true) {
  if (busy) return; busy = true;
  clearTimeout(timer);
  if (withReload) await refresh();
  const n = pages();
  next = ((next % n) + n) % n;
  if (next !== page || !$('grid').children.length) {
    $('grid').classList.add('leaving');
    await new Promise(r => setTimeout(r, 450));
    page = next;
  }
  renderPage();
  busy = false;
  schedule();
}
const schedule = () => { clearTimeout(timer); if (pages() > 1) timer = setTimeout(() => goTo(page + 1), CONFIG.PAGE_SECONDS * 1000); else timer = setTimeout(() => refresh(true), CONFIG.PAGE_SECONDS * 1000); };

async function refresh(rerender = false) {
  const st = $('status');
  try {
    const r = await loadPeople();
    people = CONFIG.SORT_DESC ? [...r.people].sort((a, b) => b.points - a.points) : r.people;
    const hh = new Date().toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit'});
    st.className = 'status';
    st.textContent = r.demo ? '目前顯示示範資料（尚未設定 SHEET_URL）' : `資料來源：Google 試算表　更新於 ${hh}`;
  } catch (e) {
    console.warn('讀取試算表失敗', e);
    if (!people.length) people = [...DEMO].sort((a, b) => b.points - a.points);
    st.className = 'status warn';
    st.textContent = '⚠ 無法讀取試算表，暫時顯示' + (people === DEMO ? '示範' : '先前') + '資料';
  }
  if (page >= pages()) page = 0;
  if (rerender && !busy) { schedule(); renderPage(); }
}

$('prev').onclick = () => goTo(page - 1, false);
$('next').onclick = () => goTo(page + 1, false);
$('dots').onclick = e => { const p = e.target.dataset.p; if (p !== undefined) goTo(+p, false); };
document.addEventListener('visibilitychange', () => {   // 分頁被切到背景時暫停換頁
  $('dots').classList.toggle('paused', document.hidden);
  if (document.hidden) clearTimeout(timer); else goTo(page, true);
});

/* 依螢幕縮放 16:9 舞台；雙擊畫面可切換全螢幕 */
const fit = () => document.getElementById('tv').style.setProperty('--k', Math.min(innerWidth / 1920, innerHeight / 1080));
addEventListener('resize', fit); fit();
addEventListener('dblclick', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());

/* 標題跟隨滑鼠 */
const ti = document.querySelector('[data-title] img');
addEventListener('pointermove', e => {
  const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
  ti.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 5}deg)`;
});
</script>
